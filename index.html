<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 数字人对话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.ct{text-align:center;max-width:760px;width:92%;padding:28px 0}
.logo{font-size:64px;margin-bottom:16px}
h1{font-size:28px;margin-bottom:8px;font-weight:600}
.sub{color:rgba(255,255,255,.62);font-size:15px;margin-bottom:22px}
.panels{display:grid;gap:10px;margin:0 auto 28px;max-width:720px}
.band{display:grid;gap:8px;padding:12px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;text-align:left}
.band h2{font-size:14px;line-height:1.3}.band p,.band li{font-size:13px;line-height:1.6;color:rgba(255,255,255,.72)}.band ul{padding-left:18px}.band-btn{justify-self:start;padding:8px 14px;border:0;border-radius:6px;background:#667eea;color:#fff;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.band-btn:disabled{opacity:.55;cursor:not-allowed}
.grid{display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.card{background:rgba(255,255,255,.08);border-radius:12px;padding:16px 20px;min-width:160px;border:1px solid rgba(255,255,255,.1)}
.card-link{color:inherit;text-decoration:none;display:block;transition:transform .2s,border-color .2s,box-shadow .2s}
.card-link.ok:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(102,126,234,.22);border-radius:12px}
.card-link.ok .card{border-color:rgba(120,140,255,.32)}
.card-link.ok:hover .card{border-color:rgba(120,140,255,.7)}
.card .nm{font-size:14px;color:rgba(255,255,255,.78);margin-bottom:6px}.card .num{font-size:28px;font-weight:700}.ok .num{color:#4ade80}.busy .num{color:#f87171}.off .num{color:#9ca3af}
.btn{display:inline-block;padding:16px 48px;font-size:18px;font-weight:600;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;cursor:pointer;text-decoration:none;transition:all .3s;box-shadow:0 8px 30px rgba(102,126,234,.4)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(102,126,234,.5)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{color:rgba(255,255,255,.62);font-size:15px;margin-top:18px}.tip{color:rgba(255,255,255,.42);font-size:13px;margin-top:22px}.sp{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ct">
<div class="logo">&#129302;</div>
<h1>AI 数字人对话</h1>
<p class="sub">智能分配空闲服务器，即刻开始对话</p>
<div class="panels" id="panels"></div>
<div class="grid" id="grid"><div class="card off"><div class="nm">加载中...</div><div class="num">--</div></div></div>
<div id="act"><span class="sp"></span>正在查询服务器状态...</div>
<p class="tip" id="tip" style="display:none">请选择一条线路进入对话</p>
</div>
<script>
const MACHINES=[{"id":"1","name":"1号机 (RTX 4080S 32GB)","url":"https://uu1120778-8131-90c71562.westb.seetacloud.com:8443","max":1},{"id":"2","name":"2号机（4080s 32gb）","url":"https://uu1120778-3zb9-a4fb444b.weste.seetacloud.com:8443","max":1},{"id":"4","name":"4号机（3080ti 12gb）","url":"https://uu1120778-b88f-8d092a8c.westb.seetacloud.com:8443","max":1},{"id":"3","name":"3号机（4080s 32gb）","url":"https://uu1120778-3zb9-f5aecdde.weste.seetacloud.com:8443","max":1}];
let autoUrl=null, panelsConfig=null;
async function loadPanels(){
  try{
    const res=await fetch('./site-panels.json',{cache:'no-store'});
    if(!res.ok)return;
    const cfg=await res.json();
    panelsConfig=cfg;
    const el=document.getElementById('panels');
    let html='';
    if(cfg.notice&&cfg.notice.enabled)html+=`<section class="band"><h2>${cfg.notice.title||'温馨提示'}</h2><p>${cfg.notice.body||''}</p></section>`;
    if(cfg.bulletin&&cfg.bulletin.enabled)html+=`<section class="band"><h2>${cfg.bulletin.title||'公告'}</h2><ul>${(cfg.bulletin.items||[]).map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
    if(cfg.support&&cfg.support.enabled){
      const btn=(cfg.support.buttonText?`<a class="band-btn" href="${cfg.support.buttonAction||'#'}" target="_blank" rel="noopener noreferrer">${cfg.support.buttonText}</a>`:'');
      const pingBtns=(cfg.ping?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="band-btn ping-btn" type="button" onclick="pingOwner(false,this)">${cfg.ping.normalText||'戳一戳站长'}</button><button class="band-btn ping-btn" type="button" onclick="pingOwner(true,this)">${cfg.ping.vipText||'打赏后提醒站长'}</button></div>`:'');
      html+=`<section class="band"><h2>${cfg.support.title||'为爱发电'}</h2><p>${cfg.support.body||''}</p>${btn}${pingBtns}<div id="ping-status" style="font-size:12px;color:rgba(255,255,255,.6)"></div></section>`;
    }
    el.innerHTML=html;
  }catch(_ ){ }
}
async function fetchOnline(machine){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),5000);
    const resp=await fetch(machine.url+'/api/online',{signal:controller.signal,headers:{'User-Agent':'dispatcher/1.0'}});
    clearTimeout(timeout);
    const data=await resp.json();
    const online=(data.sessions||[]).length;
    return {...machine,online,available:online<machine.max,error:null};
  }catch(e){
    return {...machine,online:0,available:false,error:e.message||'offline'};
  }
}
async function refreshServers(){
  try{
    const results=await Promise.all(MACHINES.map(fetchOnline));
    renderServers(results);
  }catch(_ ){
    document.getElementById('act').innerHTML='<p class="msg">无法连接调度服务，请刷新</p>';
  }
}
function renderServers(ms){
  const g=document.getElementById('grid'),a=document.getElementById('act'),t=document.getElementById('tip');
  let h='';
  for(let i=0;i<ms.length;i++){
    const m=ms[i]; let c='off',l='离线';
    if(m.error){c='off';l='离线';}
    else if(m.available){c='ok';l=`${m.online}/${m.max} 在线`;}
    else{c='busy';l=`已满 ${m.online}/${m.max}`;}
    const num=m.error?'✕':`${m.online}/${m.max}`;
    const enter=!m.error&&m.available?`<div style="font-size:12px;color:#aab4ff;margin-top:8px">点击进入 →</div>`:`<div style="font-size:12px;color:rgba(255,255,255,.45);margin-top:8px">${l}</div>`;
    const inner=`<div class="card ${c}"><div class="nm">${m.name}</div><div class="num">${num}</div>${enter}</div>`;
    h+=(!m.error&&m.available)?`<a class="card-link ${c}" href="${m.url}">${inner}</a>`:inner;
  }
  g.innerHTML=h;
  const av=ms.filter(m=>m.available).sort((x,y)=>x.online-y.online);
  if(av.length){
    const m=av[0]; autoUrl=m.url;
    a.innerHTML=`<a class="btn" href="${m.url}">立即进入对话 &#8594;</a><p class="msg">推荐线路：<b>${m.name}</b>（${m.online}/${m.max} 人在线）</p>`;
    t.style.display='block';
  }else{
    const allOffline=ms.every(m=>m.error);
    a.innerHTML=allOffline?'<p class="msg">所有服务器暂时离线，请稍后再试</p>':'<button class="btn" disabled>服务器繁忙</button><p class="msg">当前所有线路已满，请稍后再试</p>';
    t.style.display='none';
  }
}
async function pingOwner(vip,clickedButton){
  const el=document.getElementById('ping-status');
  const apiBase=panelsConfig&&panelsConfig.ping&&String(panelsConfig.ping.apiBase||'').trim().replace(/\/$/,'');
  if(!apiBase||/^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/i.test(apiBase)){ if(el) el.textContent='提醒接口尚未接入公网，请稍后再试'; return; }
  const buttons=Array.from(document.querySelectorAll('.ping-btn'));
  const originalText=clickedButton?clickedButton.textContent:'';
  buttons.forEach(button=>button.disabled=true);
  if(clickedButton)clickedButton.textContent='提醒中...';
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    if(el) el.textContent='正在提醒站长...';
    const resp=await fetch(apiBase+'/api/ping-owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vip:!!vip,source:'GitHub Pages 首页'}),signal:controller.signal});
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok||!data.ok) throw new Error(data.error||`HTTP ${resp.status}`);
    if(el) el.textContent=vip?'已提醒站长（打赏优先）⚡':'已提醒站长，稍等开机～';
  }catch(e){
    if(el) el.textContent=e.name==='AbortError'?'提醒超时，请稍后重试':'提醒失败：'+e.message;
  }finally{
    clearTimeout(timeout);
    buttons.forEach(button=>button.disabled=false);
    if(clickedButton)clickedButton.textContent=originalText;
  }
}
loadPanels();
refreshServers();
setInterval(refreshServers,10000);
</script>
</body>
</html>
